name: men_in_the_middle
description: "The MiddleMen — a mobile game built with Flutter and Flame."
publish_to: 'none'

version: 0.3.0-alpha.2+3

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # Game engine
  flame: ^1.23.0
  flame_audio: ^2.11.0

  # UI / typography
  google_fonts: ^6.2.1
  flutter_riverpod: ^3.3.2

  # Persistence / DB
  shared_preferences: ^2.5.3
  sqflite: ^2.4.2
  sqflite_common_ffi: ^2.3.4
  sqlite3_flutter_libs: ^0.5.26
  path: ^1.9.1

  # Crypto
  crypto: ^3.0.7

  # Logging / diagnostics
  logging: ^1.3.0
  path_provider: ^2.1.5

  # Video (cross-platform incl. Windows)
  media_kit: ^1.1.10
  media_kit_video: ^1.2.4
  media_kit_libs_windows_video: ^1.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.5

flutter:
  uses-material-design: true

  # Flutter does not pick up asset folders recursively — every subfolder that
  # holds assets must be listed explicitly, otherwise its files never make it
  # into the build.
  assets:
    - assets/data/
    - assets/data/catalog/
    - assets/media/
    - assets/images/
    - assets/images/backgrounds/
    - assets/images/characters/
    - assets/images/hacker/
    - assets/images/icons/
    - assets/images/ui/
    - assets/images/ui/icons/
    - assets/audio/
    - assets/audio/background_tracks/
    - assets/audio/sound_effects/
    - assets/fonts/

  fonts:
    - family: GeistPixel
      fonts:
        - asset: assets/fonts/GeistPixel-Regular-VariableFont_ELSH.ttf

# ── Branding (step 07) ────────────────────────────────────────────────────────
# Master art lives in assets/branding/ and is NOT bundled as a runtime asset —
# both tools generate native platform resources from it at build-config time.
# Regenerate after changing the source art:
#   dart run flutter_launcher_icons
#   dart run flutter_native_splash:create
flutter_launcher_icons:
  image_path: assets/branding/app_icon.png
  android: true
  # Adaptive icon: the launcher mask crops to roughly the centre 66%, so the
  # foreground art is deliberately drawn smaller than the legacy icon.
  adaptive_icon_background: "#0A0A0C"
  adaptive_icon_foreground: assets/branding/app_icon_foreground.png
  min_sdk_android: 21
  windows:
    generate: true
    image_path: assets/branding/app_icon.png
    icon_size: 256

flutter_native_splash:
  color: "#0A0A0C"
  image: assets/branding/splash_logo.png
  android: true
  # No `windows:` key — this version of flutter_native_splash rejects it as
  # unknown; the Windows runner shows no white flash to fix anyway.
  android_12:
    # Android 12+ ignores the legacy splash and draws its own centred icon on
    # a solid background, so it needs its own entry or the theme colour leaks.
    color: "#0A0A0C"
    image: assets/branding/splash_logo.png
