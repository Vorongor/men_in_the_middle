name: men_in_the_middle
description: "The MiddleMen — a mobile game built with Flutter and Flame."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # Game engine
  flame: ^1.23.0
  flame_audio: ^2.11.0

  # UI / typography
  google_fonts: ^6.2.1

  # Persistence
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.5

flutter:
  uses-material-design: true

  assets:
    - assets/images/backgrounds/
    - assets/images/characters/
    - assets/images/ui/
    - assets/audio/
    - assets/fonts/
