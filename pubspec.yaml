name: men_in_the_middle
description: "The MiddleMen — a mobile game built with Flutter and Flame."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # Game engine
  flame: ^1.23.0
  flame_audio: ^2.11.0

  # UI / typography
  google_fonts: ^6.2.1

  # Persistence / DB
  shared_preferences: ^2.5.3
  sqflite: ^2.4.2
  sqflite_common_ffi: ^2.3.4
  sqlite3_flutter_libs: ^0.5.26
  path: ^1.9.1

  # Crypto
  crypto: ^3.0.7

  # Video (cross-platform incl. Windows)
  media_kit: ^1.1.10
  media_kit_video: ^1.2.4
  media_kit_libs_windows_video: ^1.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.5

flutter:
  uses-material-design: true

  assets:
    - assets/data/
    - assets/media/
    - assets/images/backgrounds/
    - assets/images/characters/
    - assets/images/ui/
    - assets/audio/
    - assets/fonts/
